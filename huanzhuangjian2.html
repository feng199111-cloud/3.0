*{box-sizing:border-box}

main{max-width:560px;margin:0 auto;padding:20px 16px 72px}

h2{font:600 17px/1.4 "Songti SC","Noto Serif SC",serif;margin:0 0 10px}
section{margin-bottom:28px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:22px}
details.inner{margin:14px 0 0}
summary{cursor:pointer;font-weight:600}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--surface);text-align:center;overflow:hidden;cursor:pointer;position:relative;margin-top:10px}
.drop .empty{padding:40px 16px;color:var(--muted)}
.drop .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.drop img{display:block;width:100%;max-height:340px;object-fit:contain;background:#0001}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.todo{border-style:dashed}
.group{margin-bottom:12px}
.group h3{font-size:14px;color:var(--gold);margin:0 0 6px;font-weight:600}
button.main{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 17px inherit;font-family:inherit;cursor:pointer}
button.main:disabled{opacity:.5;cursor:not-allowed}
button.ghost{padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
button.ghost:disabled{opacity:.5}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.linkrow{display:flex;gap:8px;margin-top:10px}
.linkrow input{flex:1}
#status{margin-top:12px;min-height:24px;font-size:15px}
#status.err{color:var(--danger)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#stage{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#0001;border-radius:12px;overflow:hidden;min-height:240px;cursor:grab}
#stage img{display:block;max-width:100%;max-height:540px;margin:0 auto;pointer-events:none;-webkit-user-drag:none}
#angleTag{position:absolute;left:10px;bottom:10px;background:#000a;color:#fff;font-size:13px;padding:2px 10px;border-radius:999px}
#sets{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
#sets button{flex:0 0 auto;border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer}
#sets button[aria-current=true]{border-color:var(--accent)}
#sets img{width:56px;height:74px;object-fit:cover;border-radius:6px;display:block}
.origin{width:100%;border-radius:10px;display:block;margin-bottom:10px;max-height:200px;object-fit:contain;background:#0001}
#lb{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#lb.open{display:flex}
#lbwrap{flex:1;overflow:hidden;position:relative;touch-action:none}
#lbImg{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;touch-action:none;user-select:none;-webkit-user-drag:none}
#lbbar{display:flex;gap:10px;justify-content:center;padding:12px;background:#111;flex-wrap:wrap}
