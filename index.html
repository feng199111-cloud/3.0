<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #222222;
  --text2: #888888;
  --border: #e8e8ee;
  --input-bg: #f8f8fa;
  --tab-bg: #ffffff;
  --shadow: rgba(0,0,0,0.06);
  --accent: #667eea;
}
[data-theme="dark"] {
  --bg: #0f0f13;
  --card: #1c1c24;
  --text: #e8e8f0;
  --text2: #6a6a8a;
  --border: #2a2a3a;
  --input-bg: #25252f;
  --tab-bg: #1c1c24;
  --shadow: rgba(0,0,0,0.3);
  --accent: #7c8fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); min-height:100vh; font-family:'Noto Serif SC',serif; padding-bottom:80px; transition:background 0.3s,color 0.3s; color:var(--text); }

/* 顶部栏 */
.top-bar { position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px var(--shadow); }
.top-title { font-family:'ZCOOL XiaoWei',serif; font-size:18px; letter-spacing:3px; color:var(--accent); }
.top-actions { display:flex; gap:10px; align-items:center; }
.theme-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; border-radius:8px; transition:background 0.2s; }
.theme-btn:hover { background:var(--border); }
.install-btn { background:var(--accent); color:#fff; border:none; font-family:'Noto Serif SC',serif; font-size:11px; padding:5px 10px; border-radius:20px; cursor:pointer; display:none; }

/* 底部导航 */
.tab-bar { position:fixed; bottom:0; left:0; right:0; background:var(--tab-bg); border-top:1px solid var(--border); display:flex; z-index:100; box-shadow:0 -4px 20px var(--shadow); }
.tab-item { flex:1; padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border:none; background:none; transition:all 0.2s; }
.tab-icon { font-size:20px; }
.tab-label { font-size:9px; color:var(--text2); letter-spacing:0.5px; }
.tab-item.active .tab-label { color:var(--accent); font-weight:700; }
.tab-item.active .tab-icon { transform:scale(1.1); }

/* 页面 */
.page { display:none; padding:16px; max-width:680px; margin:0 auto; }
.page.active { display:block; }

.section-title { font-size:11px; color:var(--text2); letter-spacing:2px; margin-bottom:10px; }

/* 卡片 */
.card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 2px 16px var(--shadow); border:1px solid var(--border); }

label { display:block; font-size:11px; letter-spacing:1px; margin-bottom:6px; color:var(--text2); }
input[type="text"], textarea, select { width:100%; background:var(--input-bg); border:1.5px solid var(--border); color:var(--text); font-family:'Noto Serif SC',serif; font-size:13px; padding:9px 12px; border-radius:8px; outline:none; transition:border-color 0.2s; }
input:focus, textarea:focus, select:focus { border-color:var(--accent); }
textarea { resize:vertical; min-height:80px; line-height:1.8; }
select option { background:var(--card); color:var(--text); }

.btn { width:100%; padding:12px; border:none; font-family:'Noto Serif SC',serif; font-size:13px; cursor:pointer; border-radius:10px; transition:all 0.2s; letter-spacing:1px; font-weight:700; }
.btn-accent { background:var(--accent); color:#fff; }
.btn-accent:hover { opacity:0.9; transform:translateY(-1px); }
.btn-accent:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.btn-outline { background:transparent; color:var(--text2); border:1.5px solid var(--border); font-weight:400; }
.btn-sm { padding:8px 14px; width:auto; font-size:12px; border-radius:8px; }
