<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常工具 7.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background: linear-gradient(135deg, #f8f9fc 0%, #eef1f8 100%); min-height:100vh; font-family:'Noto Serif SC',serif; padding-bottom:90px; color:#222; transition:all 0.5s; }
body.dark { background: linear-gradient(135deg, #0a0a0f 0%, #1a1a24 100%); color:#eee; }

.glass { background:rgba(255,255,255,0.92); backdrop-filter:blur(32px); border:1px solid rgba(255,255,255,0.85); }
body.dark .glass { background:rgba(26,26,38,0.92); border-color:rgba(255,255,255,0.12); }

.card { border-radius:26px; padding:26px; margin-bottom:22px; box-shadow:0 12px 50px rgba(0,0,0,0.12); }
.btn { padding:15px; border-radius:16px; font-weight:700; cursor:pointer; width:100%; margin:8px 0; transition:all 0.3s; }
.btn-dark { background:linear-gradient(90deg,#222,#444); color:white; }
body.dark .btn-dark { background:linear-gradient(90deg,#ddd,#fff); color:#111; }
</style>
</head>
<body>

<!-- 顶部 -->
<div style="position:fixed;top:0;left:0;right:0;padding:16px;background:rgba(255,255,255,0.95);backdrop-filter:blur(24px);z-index:999;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 20px rgba(0,0,0,0.08);">
  <h1 style="font-family:'ZCOOL XiaoWei',serif;font-size:24px;letter-spacing:5px;">日常工具 <span style="font-size:16px;opacity:0.6;">7.0</span></h1>
  <select id="userMode" onchange="switchUser()" style="padding:8px 12px;border-radius:12px;border:1px solid #ddd;background:transparent;">
    <option value="self">本人模式</option>
    <option value="family">家庭模式</option>
  </select>
</div>

<button onclick="toggleAIChat()" style="position:fixed;bottom:120px;right:20px;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#667eea,#a45cff);color:white;font-size:34px;border:none;box-shadow:0 12px 40px rgba(102,126,234,0.5);z-index:999;">🤖</button>

<!-- AI 聊天 -->
<div id="aiChat" style="display:none;position:fixed;bottom:210px;right:20px;width:370px;height:560px;background:white;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.25);flex-direction:column;">
  <div style="padding:16px;background:linear-gradient(90deg,#667eea,#a45cff);color:white;display:flex;justify-content:space-between;align-items:center;">
    <strong>智能助手（可分析你的数据）</strong>
    <span onclick="toggleAIChat()" style="cursor:pointer;font-size:20px;">✕</span>
  </div>
  <div id="chatMessages" style="flex:1;padding:16px;overflow-y:auto;background:#fafafa;"></div>
  <div style="padding:12px;display:flex;gap:8px;">
    <input id="chatInput" placeholder="分析我的目标 / 写月报 / 鼓励我..." style="flex:1;padding:14px;border-radius:14px;border:1px solid #ddd;">
    <button onclick="sendAIMessage()" class="btn-dark" style="width:auto;padding:0 28px;">发送</button>
  </div>
</div>

<!-- 主仪表盘 -->
<div class="page active" id="page-dashboard">
  <div style="text-align:center;margin:80px 0 30px;">
    <h2>人生总览</h2>
    <p id="currentDate" style="color:#666;"></p>
  </div>

  <div class="card glass">
    <h3>🎯 核心目标</h3>
    <div id="goalsList"></div>
    <button class="btn btn-dark" onclick="addNewGoal()">+ 新增目标</button>
  </div>

  <div class="card glass">
    <h3>📊 月度总结</h3>
    <button onclick="generateMonthlyReport()" class="btn btn-dark">✨ AI 生成本月报告</button>
    <div id="monthlyReport" style="margin-top:16px; line-height:1.8; font-size:14.5px; min-height:100px;"></div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar" style="background:#fff;">
  <button class="tab-item active" onclick="switchTab('dashboard',this)">🌟<div class="tab-label">总览</div></button>
  <button class="tab-item" onclick="switchTab('morning',this)">🌅<div class="tab-label">早晨</div></button>
  <button class="tab-item" onclick="switchTab('card',this)">🎊<div class="tab-label">贺卡</div></button>
  <button class="tab-item" onclick="switchTab('note',this)">📓<div class="tab-label">笔记</div></button>
  <button class="tab-item" onclick="switchTab('more',this)">🌿<div class="tab-label">更多</div></button>
</div>

<script>
// ==================== 配置 ====================
const ANTHROPIC_KEY = ""; // ← 请填入你的 Anthropic API Key

let currentUser = "self";
let goals = JSON.parse(localStorage.getItem('goals') || '[]');

function switchUser() {
  currentUser = document.getElementById('userMode').value;
  alert(currentUser === 'family' ? '👨‍👩‍👧 已切换到家庭模式' : '👤 已切换到本人模式');
}
