<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3.0 日常工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f7; min-height:100vh; font-family:'Noto Serif SC',serif; padding-bottom:80px; transition:background 0.5s; }

.tab-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:flex; z-index:100; box-shadow:0 -4px 20px rgba(0,0,0,0.06); }
.tab-item { flex:1; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border:none; background:none; font-family:'Noto Serif SC',serif; transition:all 0.2s; }
.tab-icon { font-size:22px; }
.tab-label { font-size:10px; color:#bbb; letter-spacing:0.5px; }
.tab-item.active .tab-label { color:#222; font-weight:700; }
.tab-item.active .tab-icon { transform:scale(1.1); }

.page { display:none; padding:20px 16px; max-width:680px; margin:0 auto; }
.page.active { display:block; }

.page-header { text-align:center; margin-bottom:24px; padding-top:8px; }
.page-header h2 { font-family:'ZCOOL XiaoWei',serif; font-size:clamp(20px,5vw,30px); letter-spacing:4px; margin-bottom:4px; }
.page-header p { font-size:11px; color:#aaa; letter-spacing:2px; }

.card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 16px rgba(0,0,0,0.06); }

label { display:block; font-size:11px; letter-spacing:1px; margin-bottom:7px; color:#888; }
input[type="text"], textarea { width:100%; background:#f8f8fa; border:1.5px solid #e8e8ee; color:#222; font-family:'Noto Serif SC',serif; font-size:13px; padding:9px 12px; border-radius:8px; outline:none; transition:border-color 0.2s; }
input:focus, textarea:focus { border-color:#aaa; }
textarea { resize:vertical; min-height:80px; line-height:1.8; }

.btn { width:100%; padding:12px; border:none; font-family:'Noto Serif SC',serif; font-size:14px; cursor:pointer; border-radius:10px; transition:all 0.2s; letter-spacing:1px; font-weight:700; }
.btn-dark { background:#222; color:#fff; }
.btn-dark:hover { background:#333; transform:translateY(-1px); }
.btn-dark:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.btn-outline { background:#f5f5f7; color:#555; border:1.5px solid #e8e8ee; font-weight:400; }

/* 早晨祝福 */
.blessing-card { background:linear-gradient(135deg,#667eea,#764ba2); border-radius:20px; padding:32px 24px; text-align:center; color:#fff; margin-bottom:16px; position:relative; overflow:hidden; box-shadow:0 8px 32px rgba(102,126,234,0.3); min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:background 0.8s ease; }
.blessing-card::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 60%); }
.blessing-date { font-size:11px; letter-spacing:2px; opacity:0.7; position:relative; }
.blessing-text { font-size:clamp(15px,3.5vw,20px); line-height:1.9; letter-spacing:1px; font-weight:700; position:relative; white-space:pre-line; }
.blessing-emoji { font-size:36px; position:relative; animation:float 3s ease-in-out infinite; }

.mood-row { display:flex; gap:8px; margin-bottom:14px; }
.mood-btn { flex:1; padding:10px 4px; background:#f8f8fa; border:1.5px solid #e8e8ee; border-radius:10px; font-size:18px; cursor:pointer; text-align:center; transition:all 0.15s; }
.mood-btn.active { border-color:#667eea; background:#f0f0ff; transform:scale(1.08); }

/* 贺卡 */
.mode-toggle { display:flex; gap:8px; margin-bottom:14px; }
.mode-btn { flex:1; padding:9px; border-radius:8px; border:1.5px solid #e8e8ee; background:#f0f0f5; color:#666; font-family:'Noto Serif SC',serif; font-size:12px; cursor:pointer; transition:all 0.2s; }
.mode-btn.active { background:#222; color:#fff; border-color:#222; }

.festival-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; scrollbar-width:none; }
.festival-scroll::-webkit-scrollbar { display:none; }
.fest-chip { flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid #e8e8ee; background:#f8f8fa; color:#555; font-family:'Noto Serif SC',serif; font-size:12px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.fest-chip.active { background:#222; color:#fff; border-color:#222; }

.greeting-card-preview { border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.1); margin-bottom:14px; min-height:240px; display:flex; flex-direction:column; position:relative; }
/* JS部分太长，这里省略，请参考你原始文件 */
</style>
</head>
