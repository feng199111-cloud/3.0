<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日常工具 7.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f7; font-family:'Noto Serif SC',serif; padding-bottom:80px; }
.card { background:white; margin:20px 16px; border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.btn { width:100%; padding:14px; background:#222; color:white; border:none; border-radius:12px; font-size:16px; margin:10px 0; }
.greeting-card { border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.15); margin:20px 16px; }
</style>
</head>
<body>

<h1 style="text-align:center;padding:20px 0;background:#222;color:white;margin:0;">我的日常工具 7.0</h1>

<div class="card">
  <h3>🎊 节日贺卡</h3>
  <p style="margin:10px 0 15px;color:#666;">选择节日后点击生成</p>
  
  <select id="festSelect" style="width:100%;padding:12px;border-radius:8px;margin-bottom:12px;">
    <option value="新年快乐">新年快乐</option>
    <option value="生日快乐">生日快乐</option>
    <option value="春节吉祥">春节吉祥</option>
    <option value="中秋快乐">中秋快乐</option>
    <option value="感谢有你">感谢有你</option>
  </select>

  <input type="text" id="toName" placeholder="送给谁？（例：妈妈）" style="width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #ddd;">
  
  <button onclick="generateCard()" class="btn">生成贺卡并下载</button>
</div>

<!-- 贺卡预览区域 -->
<div id="cardPreview" class="greeting-card" style="display:none;background:white;">
  <div style="background:linear-gradient(135deg,#c0392b,#8b0000);color:white;padding:40px 20px;text-align:center;">
    <div id="cardEmoji" style="font-size:40px;margin-bottom:10px;">🎊</div>
    <div id="cardTitle" style="font-size:28px;font-weight:700;letter-spacing:4px;">新年快乐</div>
  </div>
  <div style="padding:25px;background:#fff9f0;min-height:180px;">
    <div style="margin-bottom:20px;">致：<span id="cardTo" style="font-weight:700;color:#c0392b;"></span></div>
    <div id="cardMsg" style="line-height:2.0;color:#333;min-height:100px;">祝福语将显示在这里...</div>
    <div style="text-align:right;margin-top:20px;color:#c0392b;">—— <span id="cardFrom">feng</span></div>
  </div>
</div>

<script>
function generateCard() {
  const to = document.getElementById('toName').value.trim() || "亲爱的朋友";
  const fest = document.getElementById('festSelect').value;
  
  document.getElementById('cardTo').textContent = to;
  document.getElementById('cardTitle').textContent = fest;
  document.getElementById('cardMsg').innerHTML = `值此${fest}之际，祝你身体健康、万事如意、开心快乐每一天！<br><br>愿所有的美好，都如约而至。`;
  document.getElementById('cardPreview').style.display = 'block';

  // 自动下载
  setTimeout(() => {
    html2canvas(document.getElementById('cardPreview'), {scale: 3}).then(canvas => {
      const link = document.createElement('a');
      link.download = `${fest}_贺卡.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }, 800);
}
</script>

</body>
</html>
