<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3.0 日常工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f7; min-height:100vh; font-family:'Noto Serif SC',serif; padding-bottom:80px; transition:background 0.5s; }
.tab-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:flex; z-index:100; box-shadow:0 -4px 20px rgba(0,0,0,0.06); }
.tab-item { flex:1; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border:none; background:none; font-family:'Noto Serif SC',serif; transition:all 0.2s; }
.tab-icon { font-size:22px; }
.tab-label { font-size:10px; color:#bbb; letter-spacing:0.5px; }
.tab-item.active .tab-label { color:#222; font-weight:700; }
.tab-item.active .tab-icon { transform:scale(1.1); }
.page { display:none; padding:20px 16px; max-width:680px; margin:0 auto; }
.page.active { display:block; }
.page-header { text-align:center; margin-bottom:24px; padding-top:8px; }
.page-header h2 { font-family:'ZCOOL XiaoWei',serif; font-size:clamp(20px,5vw,30px); letter-spacing:4px; margin-bottom:4px; }
.page-header p { font-size:11px; color:#aaa; letter-spacing:2px; }
.card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 16px rgba(0,0,0,0.06); }
label { display:block; font-size:11px; letter-spacing:1px; margin-bottom:7px; color:#888; }
input[type="text"], textarea { width:100%; background:#f8f8fa; border:1.5px solid #e8e8ee; color:#222; font-family:'Noto Serif SC',serif; font-size:13px; padding:9px 12px; border-radius:8px; outline:none; transition:border-color 0.2s; }
input:focus, textarea:focus { border-color:#aaa; }
textarea { resize:vertical; min-height:80px; line-height:1.8; }
.btn { width:100%; padding:12px; border:none; font-family:'Noto Serif SC',serif; font-size:14px; cursor:pointer; border-radius:10px; transition:all 0.2s; letter-spacing:1px; font-weight:700; }
.btn-dark { background:#222; color:#fff; }
.btn-dark:hover { background:#333; transform:translateY(-1px); }
.btn-outline { background:#f5f5f7; color:#555; border:1.5px solid #e8e8ee; font-weight:400; }
</style>
</head>
<body>
<div class="page active" id="page-morning">
  <div class="page-header">
    <h2>🌅 早晨祝福</h2>
    <p>每天给自己一份力量</p>
  </div>
  <div class="card">
    <label>今天的心情</label>
    <input type="text" placeholder="😊 💪 🌈 😌 🔥" style="margin-bottom:14px">
    <label>今日目标（选填）</label>
    <input type="text" placeholder="例：完成报告、跑步30分钟…" maxlength="40" style="margin-bottom:14px">
    <button class="btn btn-dark">✨ 生成今日祝福</button>
  </div>
</div>
<div class="tab-bar">
  <button class="tab-item active">
    <div class="tab-icon">🌅</div>
    <div class="tab-label">早晨祝福</div>
  </button>
</div>
</body>
</html>
